/virtual_serial: #虚拟串口
  ros__parameters:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
    vision_mode: 1 # 0-outpost 6-guard 7-base 8-rune
    color: 0 # 0:红色 1:蓝色
    has_rune: false
/armor_detector:
  ros__parameters:
    debug: true
    detect_color: 0 #0:red;1:blue

    ai_model_path: "/model/0526.engine"  # 相对于包的路径
    ai_device: "GPU"  # 仅支持 GPU (需要 CUDA 支持)
    ai_conf_threshold: 0.65  # 置信度阈值
    ai_nms_threshold: 0.45   # NMS阈值