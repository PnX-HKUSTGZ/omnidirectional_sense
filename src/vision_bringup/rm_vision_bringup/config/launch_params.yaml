camera: hik

# 相机设备映射 (USB相机的 /dev/video 设备路径)
camera_devices:
  0: "/dev/camera_front"
  1: "/dev/camera_right"
  2: "/dev/camera_back"
  3: "/dev/camera_left"

# 每路相机的参数文件（相对 config/ 路径），便于为不同相机指定独立的 ros__parameters 与标定
camera_param_files:
  0: "cam_front_params.yaml"
  1: "cam_right_params.yaml"
  2: "cam_back_params.yaml"
  3: "cam_left_params.yaml"

# 四个摄像头的 TF 参数配置
# cam0: 前方摄像头
odom2camera_0:
  xyz: "\"0.065 0.0  0.15\""
  rpy: "\"0.0 -0.0  0.0\""  

# cam1: 右侧摄像头
odom2camera_1:
  xyz: "\"0.0 -0.065  0.15\""
  rpy: "\"0.0 -0.0  -1.5708\""

# cam2: 后方摄像头
odom2camera_2:
  xyz: "\"-0.16 -0.0  0.15\""
  rpy: "\"0.0 -0.0  3.1416\""

# cam3: 左侧摄像头
odom2camera_3:
  xyz: "\"-0.0 0.065  0.15\""
  rpy: "\"0.0 -0.0  1.5708\""

detector_log_level: INFO
tracker_log_level: INFO
serial_log_level: INFO

# 设置启动参数
# true: 读取视频 false: 读取相机
video_play: false
# true: 开启打符 false：关闭打符 非必要保持常开
rune: true
# true: 单计算机测试模式 false: 多计算机协同工作
unit_test: false